services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: certgen
      POSTGRES_PASSWORD: certgen
      POSTGRES_DB: certgen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certgen -d certgen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
